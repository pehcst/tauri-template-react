[package]
name = "tauri-react-template"
version = "0.1.0"
description = "Tauri and React desktop starter"
edition = "2021"

[lib]
name = "tauri_react_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
